<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' tauri: http://tauri.localhost; connect-src 'self' http://127.0.0.1:8090 http://127.0.0.1:8000 ws://127.0.0.1:8090 ws://127.0.0.1:8000; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
    <title>DSIE Codex | CEO Dashboard</title>
    
    <!-- Tailwind Play CDN with Typography -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Local fallback SDKs to completely bypass Tauri WebView2 CSP drops -->
    <script src="pocketbase.umd.js"></script>
    <script src="marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#111827',
                            950: '#030712'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* ════════════════════════════════════════════════
           PHASE 1 & 2: MACRO-SKELETON & RESET
           ════════════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            /* Ultra-transparent for Windows 11 Mica integration */
            background-color: rgba(3, 7, 18, 0.45); 
            color: #f3f4f6; /* Gray-100 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Root CSS Grid Scaffold */
        #app-root {
            display: grid;
            /* Changed from 64px to auto to prevent Tauri titlebar padding blowout */
            grid-template-rows: auto 1fr;
            height: 100%;
            width: 100%;
        }

        /* Grid Row 1: Header */
        header {
            grid-row: 1;
            padding-top: calc(var(--tauri-titlebar-area-height, 0px) + 16px); /* Dynamic Hardware Frame */
            padding-bottom: 16px;
        }

        /* Grid Row 2: Main Content Container */
        #main-content {
            grid-row: 2;
            min-height: 0; /* Flexbox Blowout Protection */
            display: grid; /* We use grid here to stack tabs */
        }

        /* ════════════════════════════════════════════════
           PHASE 3: VIEW STATE ENGINE
           ════════════════════════════════════════════════ */
        .pane-hidden { 
            content-visibility: hidden; 
            visibility: hidden; /* Hard enforcement against WebView2 Ghost Text */
            position: absolute;
            pointer-events: none;
            opacity: 0;
            z-index: -1;
        }
        .pane-visible { 
            content-visibility: visible; 
            visibility: visible;
            position: relative;
            pointer-events: auto;
            opacity: 1;
            z-index: 10;
        }

        /* All tabs occupy the same cell in main-content */
        .tab-section {
            grid-row: 1;
            grid-column: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            min-height: 0;
        }

        /* ════════════════════════════════════════════════
           PHASE 4: TYPOGRAPHY & SCROLLBARS
           ════════════════════════════════════════════════ */
        .streaming-text {
            font-weight: 300;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500/30">

    <div id="app-root">
        <!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
        <header data-tauri-drag-region class="bg-gray-900/60 backdrop-blur-md border-b border-gray-800 shadow-lg flex items-center justify-between px-6 z-20">
            <div class="flex items-center space-x-6 h-full">
                <!-- Branding & Status -->
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 bg-red-500 rounded-full" id="global-pulse"></div>
                    <h1 class="text-lg font-bold tracking-widest text-white">DSIE CODEX <span class="text-gray-500 text-sm">| DASHBOARD</span></h1>
                </div>
                
                <!-- 3-Tab Navigation -->
                <div class="flex space-x-6 text-sm font-semibold tracking-wider h-full items-end">
                    <button id="btn-bus" class="border-b-2 border-emerald-500 text-white pb-4 transition-colors uppercase">Cognitive Bus</button>
                    <button id="btn-news" class="border-b-2 border-transparent text-gray-500 hover:text-gray-300 pb-4 transition-colors uppercase">News Summary</button>
                    <button id="btn-merc" class="border-b-2 border-transparent text-gray-500 hover:text-gray-300 pb-4 transition-colors uppercase">Mercenary Terminal</button>
                </div>
            </div>
            
            <div class="text-sm text-gray-400 flex flex-col items-end">
                <div id="connection-status" class="text-red-500 font-medium">Connecting...</div>
                <div id="sse-status" class="text-[10px] text-gray-500 uppercase tracking-widest">SSE: Awaiting</div>
            </div>
        </header>

        <!-- Main Content Area where tabs stack -->
        <div id="main-content">
            <!-- ═══════════════════════════ TAB 1: COGNITIVE BUS ═══════════════════════════ -->
            <section id="tab-bus" class="tab-section pane-visible">
                <div class="flex-1 overflow-y-auto p-6 space-y-6 min-h-0 flex flex-col" id="bus-messages">
                    <!-- Chat History renders here -->
                </div>
                
                <div class="flex-shrink-0 border-t border-gray-800 bg-gray-900 p-4 flex items-center space-x-3 z-20">
                    <input id="bus-input" type="text" placeholder="Send a command to Codex..."
                           class="flex-1 bg-gray-950 border border-gray-700 rounded px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition-all font-mono">
                    <button id="btn-send-bus" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded text-xs font-bold uppercase tracking-wider transition-all">Send</button>
                </div>
            </section>

            <!-- ═══════════════════════════ TAB 2: NEWS SUMMARY ═══════════════════════════ -->
            <section id="tab-news" class="tab-section pane-hidden">
                <div class="flex-1 flex flex-col min-h-0 relative">
                    <!-- State A: List View -->
                    <div id="news-list-view" class="flex-1 overflow-y-auto p-6 space-y-4 min-h-0 pane-visible">
                        <div class="text-emerald-500 text-xs font-bold uppercase tracking-widest mb-6">Latest Intelligence Briefs</div>
                        <div id="news-headlines" class="space-y-4"></div>
                        <div id="news-empty" class="text-gray-500 text-sm italic">Loading briefs...</div>
                    </div>
                    
                    <!-- State B: Reading Pane -->
                    <div id="news-reader-view" class="absolute inset-0 bg-gray-950 z-20 flex flex-col min-h-0 pane-hidden">
                        <div class="flex-shrink-0 border-b border-gray-800 bg-gray-900 px-6 py-4 flex items-center space-x-4 shadow-sm">
                            <button id="btn-close-reader" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded text-xs font-bold uppercase tracking-wider transition-all">← Back</button>
                            <span id="reader-title" class="text-sm font-medium text-emerald-400 truncate"></span>
                        </div>
                        <div id="reader-content" class="flex-1 overflow-y-auto p-8 prose prose-invert max-w-4xl mx-auto streaming-text min-h-0 text-gray-300"></div>
                    </div>
                </div>
            </section>

            <!-- ═══════════════════════════ TAB 3: MERCENARY TERMINAL ═══════════════════════════ -->
            <section id="tab-merc" class="tab-section pane-hidden">
                <div class="flex-1 flex flex-col p-6 space-y-6 min-h-0">
                    <div class="flex items-center space-x-4 flex-shrink-0 bg-gray-900 p-4 rounded border border-gray-800 z-10">
                        <label class="text-xs text-gray-500 uppercase tracking-widest font-bold">Cloud Edge:</label>
                        <select id="merc-provider"
                                class="flex-1 bg-gray-800 border border-gray-700 rounded px-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500 transition-colors">
                            <option value="">Scanning nexus nodes...</option>
                        </select>
                        <label class="text-xs text-gray-500 uppercase tracking-widest font-bold ml-4">Model:</label>
                        <input id="merc-model" type="text" placeholder="auto"
                               class="w-64 bg-gray-800 border border-gray-700 rounded px-4 py-2 text-sm text-gray-400 focus:outline-none focus:border-blue-500 transition-colors font-mono">
                    </div>
                    
                    <div id="merc-output" class="flex-1 overflow-y-auto bg-gray-900 border border-gray-800 rounded p-6 space-y-4 min-h-0">
                        <div class="text-blue-500/50 italic text-xs uppercase tracking-widest">Mercenary Terminal Online. Awaiting directive.</div>
                    </div>
                    
                    <div class="flex-shrink-0 flex items-start space-x-4 z-10">
                        <textarea id="merc-input" rows="4" placeholder="Enter multi-line prompt for execution..."
                                  class="flex-1 bg-gray-900 border border-gray-700 rounded px-5 py-4 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-all font-mono resize-none"></textarea>
                        <button id="btn-send-merc" class="bg-blue-600 hover:bg-blue-500 text-white h-[98px] px-8 rounded text-xs font-bold uppercase tracking-widest transition-all">Execute</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- ═══════════════════════════ JAVASCRIPT ═══════════════════════════ -->
    <script>
        const PB_URL = 'http://127.0.0.1:8090';
        const ROUTER_URL = 'http://127.0.0.1:8000';
        
        let pb = null;
        try {
            pb = new PocketBase(PB_URL);
        } catch(e) {
            console.error('[CORE] Failed to instantiate PocketBase:', e);
        }

        let currentSSE = null;

        // ── Tab Logic (content-visibility) ──
        const tabs = ['bus', 'news', 'merc'];

        function switchTab(name) {
            tabs.forEach(t => {
                const isMatch = t === name;
                document.getElementById(`tab-${t}`).className = `tab-section ${isMatch ? 'pane-visible' : 'pane-hidden'}`;
                
                const btn = document.getElementById(`btn-${t}`);
                if (isMatch) {
                    btn.className = `border-b-2 ${t === 'merc' ? 'border-blue-500 text-white' : 'border-emerald-500 text-white'} pb-4 transition-colors uppercase`;
                } else {
                    btn.className = 'border-b-2 border-transparent text-gray-500 hover:text-gray-300 pb-4 transition-colors uppercase';
                }
            });
            if (name === 'news') loadNews();
        }

        // Add event listeners (Bypass Tauri CSP block on inline handlers)
        document.getElementById('btn-bus').addEventListener('click', () => switchTab('bus'));
        document.getElementById('btn-news').addEventListener('click', () => switchTab('news'));
        document.getElementById('btn-merc').addEventListener('click', () => switchTab('merc'));
        document.getElementById('btn-close-reader').addEventListener('click', () => closeReader());
        document.getElementById('btn-send-bus').addEventListener('click', () => sendCommand());
        document.getElementById('bus-input').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendCommand(); });
        document.getElementById('btn-send-merc').addEventListener('click', () => sendMercenary());

        // ── Tab 1: Cognitive Bus ──
        function appendBusMessage(role, text) {
            const container = document.getElementById('bus-messages');
            const isCEO = role === 'CEO';
            const bubble = document.createElement('div');
            
            // User right (Dark Blue/900), Codex left (Dark Emerald/900)
            bubble.className = `flex flex-col ${isCEO ? 'items-end' : 'items-start'} animate-fade-in w-full`;

            let rendered = text;
            try { rendered = typeof marked !== 'undefined' ? marked.parse(text) : text; } catch(e) {}

            bubble.innerHTML = `
                <div class="text-[10px] text-gray-500 mb-1.5 uppercase tracking-widest font-bold">${isCEO ? '🧑‍💼 CEO' : '🤖 Codex'}</div>
                <div class="max-w-[85%] px-5 py-4 rounded-xl ${isCEO ? 'bg-blue-900 border border-blue-800' : 'bg-emerald-900 border border-emerald-800'}">
                    <div class="prose prose-invert prose-sm max-w-none streaming-text text-gray-100">${rendered}</div>
                </div>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        async function sendCommand() {
            const input = document.getElementById('bus-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            try { await pb.collection('transcripts').create({ role: 'CEO', text: text }); } catch(e) {}
            try {
                await fetch(`${ROUTER_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
            } catch(e) {}
        }

        // ── SSE & Network ──
        function initSSE() {
            const statusEl = document.getElementById('sse-status');
            const pulse = document.getElementById('global-pulse');
            const connStatus = document.getElementById('connection-status');
            
            if (currentSSE) currentSSE.close();
            
            // Direct Connection specified in Phase 5
            const sse = new EventSource(`${PB_URL}/api/realtime`);
            currentSSE = sse;

            sse.addEventListener('PB_CONNECT', (e) => {
                try {
                    const clientId = JSON.parse(e.data).clientId;
                    statusEl.innerHTML = '<span class="text-emerald-400 font-bold">STREAM LIVE</span>';
                    connStatus.innerHTML = '<span class="text-emerald-400">● Bus Connected</span>';
                    pulse.className = 'w-3 h-3 bg-emerald-500 rounded-full animate-pulse';
                    
                    fetch(`${PB_URL}/api/realtime`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clientId: clientId, subscriptions: ['transcripts'] })
                    }).catch(()=>{});
                } catch(err) {}
            });

            sse.addEventListener('transcripts', (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    if (payload.action === 'create' && payload.record) {
                        appendBusMessage(payload.record.role, payload.record.text);
                    }
                } catch(err) {}
            });

            sse.onerror = () => {
                statusEl.innerHTML = '<span class="text-red-500">OFFLINE</span>';
                connStatus.innerHTML = '<span class="text-red-500">● Disconnected</span>';
                pulse.className = 'w-3 h-3 bg-red-500 rounded-full'; // solid red, no pulse
                sse.close();
                setTimeout(initSSE, 5000);
            };
        }

        async function checkPB() {
            try {
                if(!pb) throw new Error("PocketBase uninitialized");
                await pb.health.check();
                
                document.getElementById('bus-messages').innerHTML = '';
                const records = await pb.collection('transcripts').getList(1, 50, { sort: 'created' });
                records.items.forEach(r => appendBusMessage(r.role, r.text));
                
                initSSE();
            } catch(e) {
                document.getElementById('connection-status').innerHTML = '<span class="text-red-500">● Offline</span>';
                document.getElementById('global-pulse').className = 'w-3 h-3 bg-red-500 rounded-full';
                document.getElementById('sse-status').innerHTML = '<span class="text-red-500">OFFLINE</span>';
                setTimeout(checkPB, 5000);
            }
        }

        // ── Tab 2: News Summary (Master-Detail) ──
        let newsArticles = [];

        async function loadNews() {
            const container = document.getElementById('news-headlines');
            const emptyEl = document.getElementById('news-empty');
            try {
                // Fetch directly from router API to read the live file, bypassing Tauri bundle cache!
                const res = await fetch(`${ROUTER_URL}/api/briefs`);
                const records = await res.json();
                newsArticles = records;
                
                if (!Array.isArray(newsArticles) || newsArticles.length === 0) {
                    emptyEl.textContent = 'No intelligence briefs currently cached.';
                    emptyEl.className = 'text-gray-500 text-sm italic pane-visible';
                    return;
                }
                emptyEl.className = 'pane-hidden';
                container.innerHTML = '';
                newsArticles.forEach((article, idx) => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-900 border border-gray-800 rounded p-5 cursor-pointer hover:border-emerald-600 transition-all animate-fade-in shadow-sm';
                    card.addEventListener('click', () => openReader(idx));

                    const title = article.cluster_topic || article.title || article.headline || 'Encrypted Brief';
                    const summary = article.executive_summary || article.summary || article.text || '';
                    
                    const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                    card.innerHTML = `
                        <div class="flex items-start justify-between">
                            <div class="flex-1 pr-4">
                                <div class="text-gray-100 font-bold text-base mb-2">${title}</div>
                                <div class="text-gray-400 text-sm leading-relaxed line-clamp-2 streaming-text">${summary.substring(0, 250)}${summary.length > 250 ? '...' : ''}</div>
                            </div>
                            <div class="text-[10px] text-gray-500 whitespace-nowrap font-mono tracking-widest uppercase mt-1 border border-gray-700 px-2 py-1 rounded bg-gray-950">${date}</div>
                        </div>`;
                    container.appendChild(card);
                });
            } catch(e) {
                emptyEl.textContent = 'Failed to load briefs from Router. File not found or offline.';
                emptyEl.className = 'text-red-500 text-sm italic pane-visible';
                console.error('[NEWS]', e);
            }
        }

        function openReader(idx) {
            const article = newsArticles[idx];
            if (!article) return;
            const title = article.cluster_topic || article.title || article.headline || 'Brief';
            const content = article.longform || article.content || article.text || article.executive_summary || '';

            document.getElementById('reader-title').textContent = title;
            try { document.getElementById('reader-content').innerHTML = marked.parse(content); } 
            catch(e) { document.getElementById('reader-content').textContent = content; }

            document.getElementById('news-list-view').className = 'flex-1 overflow-y-auto p-6 space-y-4 min-h-0 pane-hidden';
            document.getElementById('news-reader-view').className = 'absolute inset-0 bg-gray-950 z-20 flex flex-col min-h-0 pane-visible';
        }

        function closeReader() {
            document.getElementById('news-reader-view').className = 'absolute inset-0 bg-gray-950 z-20 flex flex-col min-h-0 pane-hidden';
            document.getElementById('news-list-view').className = 'flex-1 overflow-y-auto p-6 space-y-4 min-h-0 pane-visible';
        }

        // ── Tab 3: Mercenary Terminal ──
        async function loadProviders() {
            try {
                const res = await fetch(`${ROUTER_URL}/providers`);
                const data = await res.json();
                const select = document.getElementById('merc-provider');
                select.innerHTML = '';
                data.providers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.provider;
                    opt.textContent = `${p.provider} ${p.active ? '🟢' : '⚫'}`;
                    opt.dataset.model = p.default_model;
                    select.appendChild(opt);
                });
                select.addEventListener('change', () => { document.getElementById('merc-model').value = select.options[select.selectedIndex].dataset.model || ''; });
                select.dispatchEvent(new Event('change'));
            } catch(e) {}
        }

        function appendMercOutput(role, text) {
            const container = document.getElementById('merc-output');
            const div = document.createElement('div');
            const isUser = role === 'user';
            div.className = `animate-fade-in w-full mb-4`;

            let rendered = text;
            try { rendered = typeof marked !== 'undefined' ? marked.parse(text) : text; } catch(e) {}

            div.innerHTML = `
                <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1.5 font-bold">${isUser ? '🧑‍💻 YOU (TERMINAL)' : '☁️ CLOUD PAYLOAD'}</div>
                <div class="bg-gray-950 border ${isUser ? 'border-gray-800' : 'border-blue-900'} rounded px-5 py-4 text-sm streaming-text">
                    <div class="prose prose-invert prose-sm max-w-none ${isUser ? 'text-gray-400' : 'text-gray-200'}">${rendered}</div>
                </div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMercenary() {
            const provider = document.getElementById('merc-provider').value;
            const model = document.getElementById('merc-model').value;
            const input = document.getElementById('merc-input');
            const text = input.value.trim();
            if (!text || !provider) return;
            input.value = '';

            appendMercOutput('user', text);

            try {
                const res = await fetch(`${ROUTER_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider, model: model || 'default', messages: [{ role: 'user', content: text }], temperature: 0.2 })
                });
                if (!res.ok) { appendMercOutput('system', `[SYS_ERR] ${res.status}: ${await res.text()}`); return; }
                const data = await res.json();
                appendMercOutput('system', data.choices?.[0]?.message?.content || JSON.stringify(data));
            } catch(e) {
                appendMercOutput('system', `[NET_ERR] ${e.message}`);
            }
        }

        // ── Boot sequence ──
        checkPB();
        loadProviders();
    </script>
</body>
</html>
